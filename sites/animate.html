<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snow-Excalidraw — Animation Player</title>
  <link rel="stylesheet" href="https://unpkg.com/@excalidraw/excalidraw/dist/excalidraw.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #root { width: 100%; height: calc(100% - 56px); }

    /* Controls bar */
    #controls {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background: rgba(255,255,255,.95); backdrop-filter: blur(6px);
      border-top: 1px solid #dee2e6; display: flex; align-items: center;
      gap: .75rem; padding: 0 1rem; z-index: 9000;
    }
    .ctrl-btn {
      border: 1px solid #dee2e6; background: #fff; color: #1e1e2e;
      border-radius: 6px; padding: .35rem .75rem; font-size: 13px;
      cursor: pointer; transition: background .12s; user-select: none;
    }
    .ctrl-btn:hover { background: #f1f3f5; }
    .ctrl-btn:disabled { opacity: .4; cursor: default; }
    .ctrl-btn.active { background: #339af0; color: #fff; border-color: #339af0; }
    #progress-track {
      flex: 1; height: 4px; background: #dee2e6; border-radius: 2px;
      position: relative; cursor: pointer;
    }
    #progress-fill { height: 100%; background: #339af0; border-radius: 2px; transition: width .2s; }
    #step-label { font-size: 12px; color: #868e96; white-space: nowrap; min-width: 60px; text-align: right; }
    #speed-select {
      border: 1px solid #dee2e6; background: #fff; border-radius: 6px;
      padding: .3rem .4rem; font-size: 12px; cursor: pointer; color: #1e1e2e;
    }

    /* Overlay */
    .se-overlay {
      position: fixed; inset: 0 0 56px 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #fff;
      z-index: 9999; gap: .75rem;
    }
    .se-spinner {
      width: 36px; height: 36px; border: 3px solid #e9ecef;
      border-top-color: #339af0; border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .se-label { color: #868e96; font-size: 15px; }
    .se-error { text-align: center; padding: 2rem; max-width: 520px; }
    .se-error h2 { color: #c92a2a; margin-bottom: .6rem; }
    .se-error p  { color: #495057; font-size: .9rem; line-height: 1.6; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react":            "https://esm.sh/react@18",
      "react-dom":        "https://esm.sh/react-dom@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw?external=react,react-dom"
    }
  }
  </script>
</head>
<body>

<div id="root">
  <div class="se-overlay" id="overlay">
    <div class="se-spinner"></div>
    <span class="se-label">Loading player…</span>
  </div>
</div>

<!-- Controls bar (hidden until ready) -->
<div id="controls" style="display:none">
  <button class="ctrl-btn" id="btn-prev" title="Previous step">◀◀</button>
  <button class="ctrl-btn active" id="btn-play" title="Play / Pause">▶ Play</button>
  <button class="ctrl-btn" id="btn-next" title="Next step">▶▶</button>
  <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
  <span id="step-label">0 / 0</span>
  <select id="speed-select" title="Speed">
    <option value="2">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="0.5">2×</option>
    <option value="0.25">4×</option>
  </select>
</div>

<script>
// ── Bundle decoder (no external deps) ─────────────────────────────────────────
async function decodeBundle(b64url) {
  const pad = b64url + '='.repeat((4 - b64url.length % 4) % 4);
  const b64 = pad.replace(/-/g, '+').replace(/_/g, '/');
  const binStr = atob(b64);
  const bytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  const reader = ds.readable.getReader();
  writer.write(bytes);
  writer.close();
  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  const out = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0));
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return JSON.parse(new TextDecoder().decode(out));
}

// ── Build animation step groups from animseq ──────────────────────────────────
function buildSteps(diagram, animseq) {
  const allElements = diagram.elements || [];
  if (!animseq || !Array.isArray(animseq.elements) || animseq.elements.length === 0) {
    // No animseq: show full diagram in one step
    return { groups: [allElements], durations: [500], baseElements: [] };
  }

  const seqMap = {};  // id → { order, duration }
  for (const s of animseq.elements) {
    seqMap[s.id] = { order: s.order ?? 999, duration: s.duration ?? animseq.defaultDuration ?? 500 };
  }

  const animatedIds = new Set(Object.keys(seqMap));
  const baseElements = allElements.filter(el => !animatedIds.has(el.id));

  // Group by order number
  const orderMap = {};
  for (const el of allElements) {
    if (!animatedIds.has(el.id)) continue;
    const { order, duration } = seqMap[el.id];
    if (!orderMap[order]) orderMap[order] = { elements: [], duration };
    orderMap[order].elements.push(el);
  }

  const sortedOrders = Object.keys(orderMap).map(Number).sort((a, b) => a - b);
  const groups = sortedOrders.map(o => orderMap[o].elements);
  const durations = sortedOrders.map(o => orderMap[o].duration);

  return { groups, durations, baseElements };
}

// Decode and expose for module script
window.__snowReady = (async function() {
  const hash = location.hash.slice(1);
  if (!hash) return { error: 'no-hash' };
  try {
    return { bundle: await decodeBundle(hash) };
  } catch (e) {
    return { error: e.message };
  }
})();

// ── Pre-flight: surface errors without waiting for ESM CDN ───────────────────
window.__seModuleMounted = false;

function showOverlayError(html) {
  var el = document.getElementById('overlay');
  if (el) el.innerHTML = html;
}

window.__snowReady.then(function(result) {
  if (result.error === 'no-hash') {
    showOverlayError(
      '<div class="se-error"><h2>No animation data</h2>' +
      '<p>Generate a preview with:<br>' +
      '<code>uv run python open.py diagram.excalidraw --mode animate</code></p>' +
      '</div>'
    );
    return;
  }
  window.__seCdnWatchdog = setTimeout(function() {
    if (!window.__seModuleMounted) {
      showOverlayError(
        '<div class="se-error"><h2>CDN load timed out</h2>' +
        '<p>Could not load Excalidraw from <code>esm.sh</code> after 20 s.</p>' +
        '<ul style="text-align:left;margin-top:.5rem;font-size:.85rem;color:#495057">' +
        '<li>Check your internet connection and reload.</li>' +
        '<li>Or open <a href="https://excalidraw.com" target="_blank">excalidraw.com</a> directly.</li>' +
        '</ul></div>'
      );
    }
  }, 20000);
});

window.addEventListener('unhandledrejection', function(ev) {
  if (window.__seModuleMounted) return;
  clearTimeout(window.__seCdnWatchdog);
  var msg = ev.reason && (ev.reason.message || String(ev.reason)) || 'unknown error';
  showOverlayError(
    '<div class="se-error"><h2>Module load error</h2>' +
    '<p>' + msg + '</p>' +
    '<p style="margin-top:.5rem">Check internet connection or open ' +
    '<a href="https://excalidraw.com" target="_blank">excalidraw.com</a> directly.</p>' +
    '</div>'
  );
});
</script>

<script type="module">
import React         from 'react';
import { createRoot } from 'react-dom/client';
import { Excalidraw } from '@excalidraw/excalidraw';

// Signal to pre-flight watchdog that ESM imports succeeded.
window.__seModuleMounted = true;
clearTimeout(window.__seCdnWatchdog);

const { bundle, error } = await window.__snowReady;

function showError(msg) {
  document.getElementById('overlay').innerHTML =
    `<div class="se-error"><h2>Error</h2><p>${msg}</p></div>`;
}

if (!bundle) {
  showError(error === 'no-hash'
    ? 'Open via <code>uv run python open.py diagram.excalidraw --mode animate</code>'
    : `Decode failed: ${error}`);
} else {
  const diagram = bundle.diagram || bundle;
  const animseq = bundle.animation || null;
  const { groups, durations, baseElements } = buildSteps(diagram, animseq);
  const totalSteps = groups.length;

  // State
  let step = 0;             // 0 = base only; 1..N = groups revealed
  let playing = false;
  let timerHandle = null;
  let excalidrawApi = null;

  function visibleElements(s) {
    const revealed = groups.slice(0, s).flat();
    return [...baseElements, ...revealed];
  }

  function applyStep(s) {
    step = s;
    if (excalidrawApi) {
      excalidrawApi.updateScene({ elements: visibleElements(s) });
    }
    // Update controls
    document.getElementById('step-label').textContent = `${s} / ${totalSteps}`;
    const pct = totalSteps > 0 ? (s / totalSteps) * 100 : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('btn-prev').disabled = (s === 0);
    document.getElementById('btn-next').disabled = (s === totalSteps);
  }

  function scheduleNext() {
    if (!playing) return;
    const dur = (durations[step] ?? 500) * parseFloat(document.getElementById('speed-select').value);
    timerHandle = setTimeout(() => {
      if (step < totalSteps) {
        applyStep(step + 1);
        if (step < totalSteps) scheduleNext();
        else stopPlay();
      }
    }, dur);
  }

  function stopPlay() {
    playing = false;
    clearTimeout(timerHandle);
    document.getElementById('btn-play').textContent = '▶ Play';
    document.getElementById('btn-play').classList.remove('active');
  }
  function startPlay() {
    if (step >= totalSteps) applyStep(0);
    playing = true;
    document.getElementById('btn-play').textContent = '⏸ Pause';
    document.getElementById('btn-play').classList.add('active');
    scheduleNext();
  }

  // ── Render Excalidraw ──────────────────────────────────────────────────────
  function App() {
    return React.createElement(Excalidraw, {
      ref: (api) => { if (api && !excalidrawApi) { excalidrawApi = api; applyStep(0); } },
      viewModeEnabled: true,
      initialData: {
        elements: visibleElements(0),
        appState: { ...(diagram.appState || {}), collaborators: new Map(),
                    viewBackgroundColor: diagram.appState?.viewBackgroundColor ?? '#ffffff' },
        files: diagram.files || {},
      },
    });
  }

  try {
    document.getElementById('overlay').remove();
    document.getElementById('controls').style.display = 'flex';
    createRoot(document.getElementById('root')).render(React.createElement(App));
  } catch (e) {
    showError('Failed to load Excalidraw from CDN: ' + e.message);
  }

  // ── Control event listeners ────────────────────────────────────────────────
  document.getElementById('btn-play').addEventListener('click', () => {
    playing ? stopPlay() : startPlay();
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    stopPlay();
    if (step < totalSteps) applyStep(step + 1);
  });
  document.getElementById('btn-prev').addEventListener('click', () => {
    stopPlay();
    if (step > 0) applyStep(step - 1);
  });
  document.getElementById('progress-track').addEventListener('click', (e) => {
    stopPlay();
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    applyStep(Math.round(ratio * totalSteps));
  });
}
</script>
</body>
</html>
