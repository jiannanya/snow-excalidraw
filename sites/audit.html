<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snow-Excalidraw — Audit</title>
  <!-- Excalidraw stylesheet loaded from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/dist/excalidraw.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #root { width: 100%; height: 100%; }

    /* Loading / error overlay */
    .se-overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #fff;
      z-index: 9999; gap: .75rem; font-family: system-ui, sans-serif;
    }
    .se-spinner {
      width: 36px; height: 36px; border: 3px solid #e9ecef;
      border-top-color: #339af0; border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .se-label { color: #868e96; font-size: 15px; }

    .se-error { text-align: center; padding: 2rem; max-width: 560px; }
    .se-error h2 { color: #c92a2a; margin-bottom: .75rem; font-size: 1.1rem; }
    .se-error p  { color: #495057; font-size: .9rem; line-height: 1.6; }
    .se-error pre {
      font-size: 11px; background: #f8f9fa; padding: .75rem; border-radius: 6px;
      text-align: left; white-space: pre-wrap; word-break: break-all;
      margin-top: .75rem; border: 1px solid #dee2e6;
    }
    .se-btn {
      display: inline-block; margin-top: .9rem; padding: .5rem 1.2rem;
      background: #339af0; color: #fff; border-radius: 6px;
      text-decoration: none; font-size: 14px; cursor: pointer; border: none;
    }
    .se-btn:hover { background: #228be6; }
  </style>


</head>
<body>
<div id="root">
  <div class="se-overlay" id="overlay">
    <div class="se-spinner"></div>
    <span class="se-label">Loading diagram…</span>
  </div>
</div>

<script>
// ── Phase 1: decode bundle from URL hash (pure JS, no dependencies) ──────────
async function decodeBundle(b64url) {
  // Restore URL-safe base64 → standard base64, re-add padding
  const pad = b64url + '='.repeat((4 - b64url.length % 4) % 4);
  const b64 = pad.replace(/-/g, '+').replace(/_/g, '/');
  const binStr = atob(b64);
  const bytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

  // Decompress using native browser DecompressionStream (no pako / fflate needed)
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  const reader = ds.readable.getReader();
  writer.write(bytes);
  writer.close();

  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return JSON.parse(new TextDecoder().decode(out));
}

function setOverlay(html) {
  const el = document.getElementById('overlay');
  if (el) el.innerHTML = html;
}
function removeOverlay() {
  const el = document.getElementById('overlay');
  if (el) el.remove();
}

// Store decoded data for the module script to pick up
window.__snowBundle = (async function() {
  const hash = location.hash.slice(1);
  if (!hash) return { error: 'no-hash' };
  try {
    return { bundle: await decodeBundle(hash) };
  } catch (e) {
    return { error: e.message };
  }
})();

// ── Pre-flight: surface errors without waiting for ESM CDN ───────────────────
// The module script sets this flag as its very first line (after imports resolve).
window.__seModuleMounted = false;

window.__snowBundle.then(function(result) {
  if (result.error === 'no-hash') {
    setOverlay(
      '<div class="se-error"><h2>Load a diagram</h2>' +
      '<p>Select a local <code>.excalidraw</code> file to open in the editor:</p>' +
      '<input id="se-local-file" type="file" accept=".excalidraw,.json" style="margin-top:.6rem;font-size:13px">' +
      '<p style="margin-top:.8rem;font-size:.85rem;color:#868e96">Or generate via:<br>' +
      '<code>uv run python open.py diagram.excalidraw --mode audit</code></p>' +
      '</div>'
    );
    const input = document.getElementById('se-local-file');
    if (input) {
      input.addEventListener('change', async function() {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const diagram = JSON.parse(text);
          const hash = await encodeBundle({ diagram });
          location.hash = hash;
          location.reload();
        } catch (e) {
          setOverlay('<div class="se-error"><h2>Invalid file</h2><p>' +
            (e && (e.message || String(e))) + '</p></div>');
        }
      });
    }
    return;
  }
  // Hash present — arm CDN watchdog: if ESM imports never resolve, show error.
  window.__seCdnWatchdog = setTimeout(function() {
    if (!window.__seModuleMounted) {
      setOverlay(
        '<div class="se-error"><h2>CDN load timed out</h2>' +
        '<p>Could not load Excalidraw from <code>jsDelivr</code> after 20 s.</p>' +
        '<ul style="text-align:left;margin-top:.5rem;font-size:.85rem;color:#495057">' +
        '<li>Check your internet connection and reload.</li>' +
        '<li>Or drag the <code>.excalidraw</code> file onto ' +
        '<a href="https://excalidraw.com" target="_blank">excalidraw.com</a></li>' +
        '</ul></div>'
      );
    }
  }, 20000);
});

// Catch unhandled ESM import rejections for faster CDN-failure feedback.
window.addEventListener('unhandledrejection', function(ev) {
  if (window.__seModuleMounted) return;
  clearTimeout(window.__seCdnWatchdog);
  var msg = ev.reason && (ev.reason.message || String(ev.reason)) || 'unknown error';
  setOverlay(
    '<div class="se-error"><h2>Module load error</h2>' +
    '<p>' + msg + '</p>' +
        '<p style="margin-top:.5rem">Check internet or open ' +
    '<a href="https://excalidraw.com" target="_blank">excalidraw.com</a> directly.</p>' +
    '</div>'
  );
});
</script>

<script type="module">
import React         from 'https://cdn.jsdelivr.net/npm/react@18/+esm';
import { createRoot } from 'https://cdn.jsdelivr.net/npm/react-dom@18/+esm';
import { Excalidraw } from 'https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/+esm';

// Signal to pre-flight watchdog that ESM imports succeeded.
window.__seModuleMounted = true;
clearTimeout(window.__seCdnWatchdog);

const { bundle, error } = await window.__snowBundle;

if (!bundle) {
  const detail = error === 'no-hash'
    ? 'Open this page via <code>uv run python open.py diagram.excalidraw --mode audit</code>'
    : `Decode failed: ${error}`;
  setOverlay(`<div class="se-error"><h2>No diagram data</h2><p>${detail}</p></div>`);

} else {
  const diagram = bundle.diagram || bundle;

  try {
    removeOverlay();
    const root = createRoot(document.getElementById('root'));
    root.render(
      React.createElement(Excalidraw, {
        initialData: {
          elements: diagram.elements  || [],
          appState:  { ...(diagram.appState || {}), collaborators: new Map() },
          files:     diagram.files    || {},
        },
      })
    );
  } catch (e) {
    // CDN load succeeded but React render failed — offer .excalidraw download
    const json = JSON.stringify(diagram, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const href = URL.createObjectURL(blob);
    setOverlay(`
      <div class="se-error">
        <h2>Render error</h2>
        <p>Excalidraw loaded but could not mount. Download the file and drag it to
           <a href="https://excalidraw.com" target="_blank">excalidraw.com</a>.</p>
        <a class="se-btn" href="${href}" download="diagram.excalidraw">Download .excalidraw</a>
        <pre>${e.message}</pre>
      </div>`);
  }
}
</script>
</body>
</html>
